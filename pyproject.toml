[project]
name = "tablut-challenge"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "mengxian0913", email = "mengxian0913@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1",
]

[project.scripts]
tablut-challenge = "tablut_challenge:main"

[tool.uv.build-backend]
module-name = "tablut"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--strict-markers"
markers = [
    "blackbox: tests that only use the public API (get_next_movement)",
    "whitebox: tests that target internal structure, branches and helpers",
]

[tool.coverage.run]
branch = true

[tool.mypy]
# Mirrors pytest's `pythonpath = ["tests"]` so `import tree_helpers` resolves.
mypy_path = "$MYPY_CONFIG_FILE_DIR/tests"
